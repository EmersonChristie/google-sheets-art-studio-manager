<script>
  const Import = {
    state: {
      step: 'upload',
      schema: null,
      fileName: '',
      csvHeaders: [],
      csvRows: [],
      crmMappings: [],
      unusedColumnActions: {},
      previewRows: [],
      previewColumns: [],
      validation: {
        blocking: [],
        warnings: []
      },
      importResult: null,
      isLoading: false
    },

    render(root) {
      if (!this.state.schema && !this.state.isLoading) {
        this.loadSchema_(root);
        return;
      }

      if (this.state.isLoading) {
        root.innerHTML = this.renderLoading_();
        return;
      }

      if (this.state.step === 'upload') {
        root.innerHTML = this.renderUpload_();
      } else if (this.state.step === 'mapping') {
        root.innerHTML = this.renderMapping_();
      } else if (this.state.step === 'preview') {
        root.innerHTML = this.renderPreview_();
      } else if (this.state.step === 'done') {
        root.innerHTML = this.renderDone_();
      }

      this.bindEvents_(root);
    },

    reset() {
      const schema = this.state.schema;
      this.state = {
        step: 'upload',
        schema: schema,
        fileName: '',
        csvHeaders: [],
        csvRows: [],
        crmMappings: [],
        unusedColumnActions: {},
        previewRows: [],
        previewColumns: [],
        validation: { blocking: [], warnings: [] },
        importResult: null,
        isLoading: false
      };
    },

    prepare() {
      this.reset();
    },

    loadSchema_(root) {
      const module = AppStore.getModule();

      if (!module) {
        root.innerHTML = Forms.renderMessagePage(
          'Import Unavailable',
          'Switch to Artworks, Contacts, or Collections to import records.'
        );
        return;
      }

      this.state.isLoading = true;
      root.innerHTML = this.renderLoading_();

      google.script.run
        .withSuccessHandler((schema) => {
          this.state.schema = schema;
          this.state.isLoading = false;
          this.render(root);
        })
        .withFailureHandler((error) => {
          this.state.isLoading = false;
          root.innerHTML = Forms.renderMessagePage('Import Error', error.message);
        })
        .getImportSchema(module.id);
    },

    renderLoading_() {
      return `
        <div class="card card--message">
          <h2>Bulk Import</h2>
          <p class="status">Loading import settings...</p>
        </div>
      `;
    },

    renderUpload_() {
      const module = AppStore.getModule();

      return `
        <div class="import-flow">
          <div class="card">
            <h2>Bulk Import</h2>
            <p>Upload a CSV file to import into <strong>${module.label}</strong>. You'll map imported columns onto your CRM fields.</p>

            <div class="field field--file">
              <label for="import-csv-file">CSV File</label>
              <input id="import-csv-file" type="file" accept=".csv,text/csv">
              <p class="field-hint">CSV only for now. Excel files are not supported yet.</p>
            </div>

            ${this.state.fileName ? `<p class="import-meta">Selected: ${this.escapeHtml_(this.state.fileName)} (${this.state.csvRows.length} rows)</p>` : ''}
          </div>
        </div>
      `;
    },

    renderMapping_() {
      const mappedCount = this.state.crmMappings.filter((mapping) => mapping.csvHeader).length;
      const unusedHeaders = this.getUnusedCsvHeaders_();

      return `
        <div class="import-flow">
          <div class="card">
            <h2>Map to CRM Fields</h2>
            <p>Match your uploaded CSV columns to <strong>${this.state.schema.moduleLabel}</strong> fields. Each CSV column can only be used once.</p>
            <p class="import-meta">${mappedCount} of ${this.state.crmMappings.length} CRM fields mapped · ${this.state.csvRows.length} rows</p>

            <div class="import-dest-list">
              ${this.state.crmMappings.map((mapping) => this.renderCrmMappingRow_(mapping)).join('')}
            </div>

            ${this.renderUnusedColumnsSection_(unusedHeaders)}
            ${this.renderMappingIssues_()}

            <div class="import-actions">
              <button type="button" class="button-secondary" data-import-action="back-upload">Back</button>
              <button type="button" class="button-primary button-primary--inline" data-import-action="preview">Continue to Preview</button>
            </div>
          </div>
        </div>
      `;
    },

    renderCrmMappingRow_(mapping) {
      const availableCsv = this.getAvailableCsvHeadersForField_(mapping.fieldKey);
      const csvOptions = availableCsv
        .map((csvHeader) => {
          const selected = mapping.csvHeader === csvHeader ? 'selected' : '';
          return `<option value="${this.escapeHtml_(csvHeader)}" ${selected}>${this.escapeHtml_(csvHeader)}</option>`;
        })
        .join('');
      const status = this.getCrmMappingStatus_(mapping);
      const statusClass = 'import-status import-status--' + status.key;
      const requiredLabel = mapping.required
        ? '<span class="import-field-tag import-field-tag--required">Required</span>'
        : '<span class="import-field-tag">Optional</span>';

      return `
        <div class="import-dest-row">
          <div class="import-dest-row__field">
            <strong>${this.escapeHtml_(mapping.header)}</strong>
            ${requiredLabel}
          </div>

          <div class="import-dest-row__select">
            <label class="import-mapping-label" for="crm-map-${this.escapeHtml_(mapping.fieldKey)}">CSV column</label>
            <select id="crm-map-${this.escapeHtml_(mapping.fieldKey)}" data-crm-map="${this.escapeHtml_(mapping.fieldKey)}">
              <option value="">Not mapped</option>
              ${csvOptions}
            </select>
          </div>

          <div class="import-dest-row__status">
            <span class="${statusClass}">${status.label}</span>
          </div>
        </div>
      `;
    },

    renderUnusedColumnsSection_(unusedHeaders) {
      if (!unusedHeaders.length) {
        return `
          <div class="import-unused-section">
            <h3>Unused Imported Columns</h3>
            <p class="status">All imported columns are mapped to CRM fields.</p>
          </div>
        `;
      }

      const rows = unusedHeaders
        .map((csvHeader) => this.renderUnusedColumnRow_(csvHeader))
        .join('');

      return `
        <div class="import-unused-section">
          <h3>Unused Imported Columns</h3>
          <p class="field-hint">These CSV columns are not mapped to CRM fields. Ignore them or create new custom fields.</p>
          <div class="import-unused-list">${rows}</div>
        </div>
      `;
    },

    renderUnusedColumnRow_(csvHeader) {
      const action = this.state.unusedColumnActions[csvHeader] || {
        action: 'ignore',
        customFieldName: csvHeader
      };
      const showCustomInput = action.action === 'custom';

      return `
        <div class="import-unused-row">
          <div class="import-unused-row__name">
            <span class="import-mapping-label">CSV column</span>
            <strong>${this.escapeHtml_(csvHeader)}</strong>
          </div>

          <div class="import-unused-row__action">
            <label class="import-mapping-label" for="unused-action-${this.escapeHtml_(csvHeader)}">Action</label>
            <select id="unused-action-${this.escapeHtml_(csvHeader)}" data-unused-action="${this.escapeHtml_(csvHeader)}">
              <option value="ignore" ${action.action === 'ignore' ? 'selected' : ''}>Ignore</option>
              <option value="custom" ${action.action === 'custom' ? 'selected' : ''}>Create custom field</option>
            </select>
          </div>

          <div class="import-unused-row__custom" ${showCustomInput ? '' : 'hidden'}>
            <label class="import-mapping-label" for="unused-custom-${this.escapeHtml_(csvHeader)}">Custom field name</label>
            <input
              id="unused-custom-${this.escapeHtml_(csvHeader)}"
              type="text"
              data-unused-custom="${this.escapeHtml_(csvHeader)}"
              value="${this.escapeHtml_(action.customFieldName || csvHeader)}"
            >
          </div>
        </div>
      `;
    },

    renderMappingIssues_() {
      const issues = this.getMappingValidation_();

      if (!issues.blocking.length && !issues.warnings.length) {
        return '';
      }

      const blocking = issues.blocking
        .map((issue) => `<li class="import-issue import-issue--error">${this.escapeHtml_(issue)}</li>`)
        .join('');
      const warnings = issues.warnings
        .map((issue) => `<li class="import-issue import-issue--warning">${this.escapeHtml_(issue)}</li>`)
        .join('');

      return `
        <div class="import-issues">
          ${blocking ? `<ul class="import-issue-list">${blocking}</ul>` : ''}
          ${warnings ? `<ul class="import-issue-list import-issue-list--warnings">${warnings}</ul>` : ''}
        </div>
      `;
    },

    renderPreview_() {
      const previewColumns = this.state.previewColumns;
      const issues = this.state.validation;
      const canImport = issues.blocking.length === 0 && this.state.previewRows.length > 0;
      const previewLimit = Math.min(this.state.previewRows.length, 25);
      const customCount = previewColumns.filter((column) => column.isCustom).length;

      const headerCells = previewColumns
        .map((column) => {
          const suffix = column.isCustom ? ' <span class="import-preview-tag">New</span>' : '';
          return `<th>${this.escapeHtml_(column.header)}${suffix}</th>`;
        })
        .join('');

      const bodyRows = this.state.previewRows
        .slice(0, previewLimit)
        .map((row, rowIndex) => {
          const cells = previewColumns
            .map((column) => {
              const value = this.getPreviewCellValue_(row, column);
              const display = value === undefined || value === null ? '' : String(value);
              const hasError = issues.blocking.some(
                (issue) => issue.row === rowIndex + 1 && issue.field === column.header
              );
              const cellClass = hasError ? 'import-preview-cell import-preview-cell--error' : 'import-preview-cell';
              return `<td class="${cellClass}">${this.escapeHtml_(display)}</td>`;
            })
            .join('');

          return `<tr>${cells}</tr>`;
        })
        .join('');

      const blocking = issues.blocking
        .slice(0, 12)
        .map((issue) => {
          const prefix = issue.row ? 'Row ' + issue.row + ', ' : '';
          return `<li class="import-issue import-issue--error">${prefix}${this.escapeHtml_(issue.field)}: ${this.escapeHtml_(issue.message)}</li>`;
        })
        .join('');

      return `
        <div class="import-flow">
          <div class="card">
            <h2>Preview Import</h2>
            <p class="import-meta">${this.state.previewRows.length} rows · ${previewColumns.length} columns${customCount ? ' · ' + customCount + ' new custom field(s)' : ''}</p>

            ${issues.blocking.length ? `<ul class="import-issue-list">${blocking}</ul>` : '<p class="status">All mapped rows passed validation.</p>'}

            <div class="import-preview-wrap">
              <table class="import-preview-table">
                <thead><tr>${headerCells}</tr></thead>
                <tbody>${bodyRows}</tbody>
              </table>
            </div>

            ${this.state.previewRows.length > previewLimit ? `<p class="field-hint">Showing first ${previewLimit} rows.</p>` : ''}

            <div class="import-actions">
              <button type="button" class="button-secondary" data-import-action="back-mapping">Back</button>
              <button type="button" class="button-primary button-primary--inline" data-import-action="confirm" ${canImport ? '' : 'disabled'}>
                Import ${this.state.previewRows.length} Records
              </button>
            </div>
          </div>
        </div>
      `;
    },

    renderDone_() {
      const result = this.state.importResult || {};

      return `
        <div class="import-flow">
          <div class="card card--message">
            <h2>Import Complete</h2>
            <p>${this.escapeHtml_(result.message || 'Import finished.')}</p>
            <div class="import-actions import-actions--single">
              <button type="button" class="button-primary button-primary--inline" data-import-action="done">Back to Dashboard</button>
            </div>
          </div>
        </div>
      `;
    },

    bindEvents_(root) {
      const fileInput = root.querySelector('#import-csv-file');

      if (fileInput) {
        fileInput.addEventListener('change', (event) => {
          this.handleFileSelected_(event.target.files[0], root);
        });
      }

      root.querySelectorAll('[data-crm-map]').forEach((select) => {
        select.addEventListener('change', (event) => {
          this.updateCrmMapping_(event.target.getAttribute('data-crm-map'), event.target.value);
          this.syncUnusedColumns_();
          this.render(root);
        });
      });

      root.querySelectorAll('[data-unused-action]').forEach((select) => {
        select.addEventListener('change', (event) => {
          const csvHeader = event.target.getAttribute('data-unused-action');
          this.updateUnusedAction_(csvHeader, event.target.value);
          this.render(root);
        });
      });

      root.querySelectorAll('[data-unused-custom]').forEach((input) => {
        input.addEventListener('input', (event) => {
          const csvHeader = event.target.getAttribute('data-unused-custom');
          this.updateUnusedCustomName_(csvHeader, event.target.value);
        });

        input.addEventListener('blur', () => {
          this.render(root);
        });
      });

      root.querySelectorAll('[data-import-action]').forEach((button) => {
        button.addEventListener('click', () => {
          this.handleAction_(button.getAttribute('data-import-action'), root);
        });
      });
    },

    handleAction_(action, root) {
      if (action === 'back-upload') {
        this.state.step = 'upload';
        this.render(root);
        return;
      }

      if (action === 'preview') {
        const issues = this.getMappingValidation_();

        if (issues.blocking.length) {
          Toast.show(issues.blocking[0], 'error');
          return;
        }

        this.buildPreview_();
        this.state.step = 'preview';
        this.render(root);
        return;
      }

      if (action === 'back-mapping') {
        this.state.step = 'mapping';
        this.render(root);
        return;
      }

      if (action === 'confirm') {
        this.runImport_(root);
        return;
      }

      if (action === 'done') {
        this.reset();
        Actions.refreshContext();
      }
    },

    handleFileSelected_(file, root) {
      if (!file) {
        return;
      }

      const reader = new FileReader();

      reader.onload = () => {
        try {
          const parsed = this.parseCsv_(String(reader.result || ''));
          const mapped = this.autoMapDestinationFirst_(parsed.headers, this.state.schema);

          this.state.fileName = file.name;
          this.state.csvHeaders = parsed.headers;
          this.state.csvRows = parsed.rows;
          this.state.crmMappings = mapped.crmMappings;
          this.state.unusedColumnActions = mapped.unusedColumnActions;
          this.state.step = 'mapping';
          this.render(root);
        } catch (error) {
          Toast.show(error.message, 'error');
        }
      };

      reader.onerror = () => {
        Toast.show('Could not read the CSV file.', 'error');
      };

      reader.readAsText(file);
    },

    updateCrmMapping_(fieldKey, csvHeader) {
      const mapping = this.state.crmMappings.find((item) => item.fieldKey === fieldKey);

      if (!mapping) {
        return;
      }

      const previousCsv = mapping.csvHeader;
      mapping.csvHeader = csvHeader;

      if (!csvHeader) {
        mapping.confidence = 'none';
      } else if (csvHeader !== previousCsv) {
        mapping.confidence = 'manual';
      }
    },

    updateUnusedAction_(csvHeader, action) {
      const current = this.state.unusedColumnActions[csvHeader] || {
        action: 'ignore',
        customFieldName: csvHeader
      };

      current.action = action;

      if (action === 'custom' && !current.customFieldName) {
        current.customFieldName = csvHeader;
      }

      this.state.unusedColumnActions[csvHeader] = current;
    },

    updateUnusedCustomName_(csvHeader, name) {
      const current = this.state.unusedColumnActions[csvHeader] || {
        action: 'custom',
        customFieldName: csvHeader
      };

      current.action = 'custom';
      current.customFieldName = name;
      this.state.unusedColumnActions[csvHeader] = current;
    },

    syncUnusedColumns_() {
      const mappedCsv = {};
      const nextUnused = {};

      this.state.crmMappings.forEach((mapping) => {
        if (mapping.csvHeader) {
          mappedCsv[mapping.csvHeader] = true;
        }
      });

      this.state.csvHeaders.forEach((csvHeader) => {
        if (mappedCsv[csvHeader]) {
          return;
        }

        const existing = this.state.unusedColumnActions[csvHeader];
        nextUnused[csvHeader] = existing || {
          action: 'ignore',
          customFieldName: csvHeader
        };
      });

      this.state.unusedColumnActions = nextUnused;
    },

    getUsedCsvHeaders_(excludeFieldKey) {
      const used = {};

      this.state.crmMappings.forEach((mapping) => {
        if (!mapping.csvHeader || mapping.fieldKey === excludeFieldKey) {
          return;
        }

        used[mapping.csvHeader] = true;
      });

      Object.keys(this.state.unusedColumnActions).forEach((csvHeader) => {
        const action = this.state.unusedColumnActions[csvHeader];

        if (action && action.action === 'custom') {
          used[csvHeader] = true;
        }
      });

      return used;
    },

    getAvailableCsvHeadersForField_(fieldKey) {
      const used = this.getUsedCsvHeaders_(fieldKey);
      const current = this.state.crmMappings.find((mapping) => mapping.fieldKey === fieldKey);

      return this.state.csvHeaders.filter((csvHeader) => {
        if (current && current.csvHeader === csvHeader) {
          return true;
        }

        return !used[csvHeader];
      });
    },

    getUnusedCsvHeaders_() {
      const mappedCsv = {};

      this.state.crmMappings.forEach((mapping) => {
        if (mapping.csvHeader) {
          mappedCsv[mapping.csvHeader] = true;
        }
      });

      return this.state.csvHeaders.filter((csvHeader) => !mappedCsv[csvHeader]);
    },

    getCrmMappingStatus_(mapping) {
      if (!mapping.csvHeader) {
        return { key: 'none', label: 'Not mapped' };
      }

      if (
        mapping.confidence === 'exact' ||
        mapping.confidence === 'synonym' ||
        mapping.confidence === 'contains' ||
        mapping.confidence === 'fuzzy'
      ) {
        return { key: 'auto', label: 'Auto-mapped' };
      }

      return { key: 'mapped', label: 'Mapped' };
    },

    getExistingHeaderNames_() {
      return this.state.schema.columns.reduce((acc, column) => {
        acc[column.header.toLowerCase()] = column.header;
        return acc;
      }, {});
    },

    buildPreview_() {
      this.state.previewColumns = this.getPreviewColumns_();
      this.state.previewRows = this.state.csvRows.map((row) => {
        const record = { customFields: {} };

        this.state.crmMappings.forEach((mapping) => {
          if (!mapping.csvHeader) {
            return;
          }

          const value = row[mapping.csvHeader];
          record[mapping.fieldKey] =
            value === undefined || value === null ? '' : String(value).trim();
        });

        Object.keys(this.state.unusedColumnActions).forEach((csvHeader) => {
          const action = this.state.unusedColumnActions[csvHeader];

          if (!action || action.action !== 'custom') {
            return;
          }

          const customName = String(action.customFieldName || '').trim();

          if (!customName) {
            return;
          }

          const value = row[csvHeader];
          record.customFields[customName] =
            value === undefined || value === null ? '' : String(value).trim();
        });

        return record;
      });

      this.state.validation = this.validatePreviewRows_();
    },

    validatePreviewRows_() {
      const blocking = [];
      const warnings = [];
      const mappingIssues = this.getMappingValidation_();

      blocking.push.apply(
        blocking,
        mappingIssues.blocking.map((message) => ({
          row: 0,
          field: 'Mapping',
          message: message
        }))
      );
      warnings.push.apply(warnings, mappingIssues.warnings);

      const columnsByKey = this.state.schema.columns.reduce((acc, column) => {
        acc[column.fieldKey] = column;
        return acc;
      }, {});

      this.state.previewRows.forEach((record, rowIndex) => {
        this.state.crmMappings.forEach((mapping) => {
          if (!mapping.required || !mapping.csvHeader) {
            return;
          }

          if (!String(record[mapping.fieldKey] || '').trim()) {
            blocking.push({
              row: rowIndex + 1,
              field: mapping.header,
              message: mapping.header + ' is required.'
            });
          }
        });

        Object.keys(record).forEach((fieldKey) => {
          if (fieldKey === 'customFields') {
            return;
          }

          const column = columnsByKey[fieldKey];
          const value = record[fieldKey];

          if (!column || !String(value || '').trim()) {
            return;
          }

          if (column.type === 'number' || column.type === 'integer') {
            if (!Number.isFinite(Number(value))) {
              blocking.push({
                row: rowIndex + 1,
                field: column.header,
                message: column.header + ' must be a number.'
              });
            }
          }

          if (column.type === 'dropdown' && column.options.length) {
            const match = column.options.some(
              (option) => option.toLowerCase() === String(value).trim().toLowerCase()
            );

            if (!match) {
              blocking.push({
                row: rowIndex + 1,
                field: column.header,
                message: column.header + ' has an invalid value.'
              });
            }
          }

          if (fieldKey === 'email' && String(value).indexOf('@') === -1) {
            blocking.push({
              row: rowIndex + 1,
              field: column.header,
              message: column.header + ' must be a valid email.'
            });
          }
        });
      });

      return { blocking: blocking, warnings: warnings };
    },

    getMappingValidation_() {
      const blocking = [];
      const warnings = [];
      const usedCsvHeaders = {};
      const usedCustomNames = {};
      const existingHeaders = this.getExistingHeaderNames_();

      this.state.crmMappings.forEach((mapping) => {
        if (!mapping.csvHeader) {
          return;
        }

        if (usedCsvHeaders[mapping.csvHeader]) {
          blocking.push(
            'Duplicate mapping: CSV column "' + mapping.csvHeader + '" is mapped more than once.'
          );
        }

        usedCsvHeaders[mapping.csvHeader] = true;

        if (mapping.confidence === 'fuzzy' || mapping.confidence === 'contains') {
          warnings.push('Review mapping for ' + mapping.header + ' ← ' + mapping.csvHeader + '.');
        }
      });

      this.state.crmMappings.forEach((mapping) => {
        if (mapping.required && !mapping.csvHeader) {
          blocking.push('Required field "' + mapping.header + '" is not mapped.');
        }
      });

      Object.keys(this.state.unusedColumnActions).forEach((csvHeader) => {
        const action = this.state.unusedColumnActions[csvHeader];

        if (!action || action.action !== 'custom') {
          return;
        }

        const customName = String(action.customFieldName || '').trim();
        const normalized = customName.toLowerCase();

        if (!customName) {
          blocking.push('Custom field name is required for CSV column "' + csvHeader + '".');
          return;
        }

        if (existingHeaders[normalized]) {
          blocking.push(
            'Custom field "' + customName + '" matches an existing CRM field. Map "' + csvHeader + '" to that field instead.'
          );
        }

        if (usedCustomNames[normalized]) {
          blocking.push('Duplicate custom field name: "' + customName + '".');
        }

        usedCustomNames[normalized] = true;
        warnings.push('New custom field "' + customName + '" will be added to the sheet.');
      });

      return { blocking: blocking, warnings: warnings };
    },

    getPreviewColumns_() {
      const columns = [];

      this.state.crmMappings.forEach((mapping) => {
        if (!mapping.csvHeader) {
          return;
        }

        columns.push({
          header: mapping.header,
          fieldKey: mapping.fieldKey,
          isCustom: false
        });
      });

      Object.keys(this.state.unusedColumnActions).forEach((csvHeader) => {
        const action = this.state.unusedColumnActions[csvHeader];

        if (!action || action.action !== 'custom') {
          return;
        }

        const customName = String(action.customFieldName || '').trim();

        if (!customName) {
          return;
        }

        columns.push({
          header: customName,
          fieldKey: null,
          isCustom: true
        });
      });

      return columns;
    },

    getPreviewCellValue_(row, column) {
      if (column.isCustom) {
        return row.customFields ? row.customFields[column.header] : '';
      }

      return row[column.fieldKey];
    },

    getImportPayload_() {
      const customFieldHeaders = [];
      const customSeen = {};

      Object.keys(this.state.unusedColumnActions).forEach((csvHeader) => {
        const action = this.state.unusedColumnActions[csvHeader];

        if (!action || action.action !== 'custom') {
          return;
        }

        const name = String(action.customFieldName || '').trim();

        if (name && !customSeen[name.toLowerCase()]) {
          customSeen[name.toLowerCase()] = true;
          customFieldHeaders.push(name);
        }
      });

      return {
        records: this.state.previewRows,
        customFieldHeaders: customFieldHeaders
      };
    },

    runImport_(root) {
      const module = AppStore.getModule();
      const confirmButton = root.querySelector('[data-import-action="confirm"]');
      const payload = this.getImportPayload_();
      const duplicateCheck = this.getMappingValidation_();

      if (duplicateCheck.blocking.length) {
        Toast.show(duplicateCheck.blocking[0], 'error');
        this.state.validation.blocking = duplicateCheck.blocking.map((message) => ({
          row: 0,
          field: 'Mapping',
          message: message
        }));
        this.render(root);
        return;
      }

      if (confirmButton) {
        confirmButton.disabled = true;
        confirmButton.textContent = 'Importing...';
      }

      google.script.run
        .withSuccessHandler((result) => {
          if (!result.success) {
            this.state.validation.blocking = result.errors || [];
            Toast.show(result.message || 'Import failed.', 'error');
            this.render(root);
            return;
          }

          this.state.importResult = result;
          this.state.step = 'done';
          Toast.show(result.message, 'success');
          this.render(root);
        })
        .withFailureHandler((error) => {
          Toast.show(error.message, 'error');
          this.render(root);
        })
        .importModuleRecords(module.id, payload);
    },

    autoMapDestinationFirst_(csvHeaders, schema) {
      const usedCsv = {};
      const crmMappings = schema.columns.map((column) => {
        let best = { csvHeader: '', score: 0, confidence: 'none' };

        csvHeaders.forEach((csvHeader) => {
          if (usedCsv[csvHeader]) {
            return;
          }

          const match = this.scoreHeaderMatch_(
            csvHeader,
            column,
            schema.synonyms[column.fieldKey] || []
          );

          if (match.score > best.score) {
            best = {
              csvHeader: csvHeader,
              score: match.score,
              confidence: match.confidence
            };
          }
        });

        if (best.csvHeader && best.score >= 60) {
          usedCsv[best.csvHeader] = true;

          return {
            fieldKey: column.fieldKey,
            header: column.header,
            required: column.required,
            csvHeader: best.csvHeader,
            confidence: best.confidence
          };
        }

        return {
          fieldKey: column.fieldKey,
          header: column.header,
          required: column.required,
          csvHeader: '',
          confidence: 'none'
        };
      });

      const unusedColumnActions = {};

      csvHeaders.forEach((csvHeader) => {
        if (!usedCsv[csvHeader]) {
          unusedColumnActions[csvHeader] = {
            action: 'ignore',
            customFieldName: csvHeader
          };
        }
      });

      return {
        crmMappings: crmMappings,
        unusedColumnActions: unusedColumnActions
      };
    },

    scoreHeaderMatch_(csvHeader, column, synonyms) {
      const csvNorm = this.normalizeHeader_(csvHeader);
      const headerNorm = this.normalizeHeader_(column.header);
      const labelNorm = this.normalizeHeader_(column.label);
      const fieldNorm = this.normalizeHeader_(column.fieldKey);

      if (!csvNorm) {
        return { score: 0, confidence: 'none' };
      }

      if (csvNorm === headerNorm || csvNorm === labelNorm || csvNorm === fieldNorm) {
        return { score: 100, confidence: 'exact' };
      }

      const synonymList = (synonyms || []).map((item) => this.normalizeHeader_(item));

      if (synonymList.indexOf(csvNorm) !== -1) {
        return { score: 92, confidence: 'synonym' };
      }

      if (this.isValidContainsMatch_(csvNorm, headerNorm) || this.isValidContainsMatch_(headerNorm, csvNorm)) {
        return { score: 78, confidence: 'contains' };
      }

      if (this.isValidContainsMatch_(csvNorm, labelNorm) || this.isValidContainsMatch_(labelNorm, csvNorm)) {
        return { score: 74, confidence: 'contains' };
      }

      const fuzzyTargets = [headerNorm, labelNorm, fieldNorm].concat(synonymList);
      let bestRatio = 0;

      fuzzyTargets.forEach((target) => {
        const ratio = this.fuzzyRatio_(csvNorm, target);
        if (ratio > bestRatio) {
          bestRatio = ratio;
        }
      });

      if (this.canUseFuzzyMatch_(csvNorm) && bestRatio >= 0.82) {
        return { score: Math.round(bestRatio * 90), confidence: 'fuzzy' };
      }

      return { score: 0, confidence: 'none' };
    },

    isValidContainsMatch_(needle, haystack) {
      if (!needle || !haystack || needle === haystack) {
        return false;
      }

      if (needle.length < 3) {
        return false;
      }

      if (haystack.indexOf(needle) === -1) {
        return false;
      }

      const pattern = new RegExp('(^|\\s)' + this.escapeRegExp_(needle) + '(\\s|$)');
      return pattern.test(haystack);
    },

    canUseFuzzyMatch_(value) {
      return String(value || '').trim().length >= 3;
    },

    escapeRegExp_(value) {
      return String(value).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    },

    normalizeHeader_(value) {
      const base = String(value || '')
        .toLowerCase()
        .trim()
        .replace(/[_\-\.]+/g, ' ')
        .replace(/[^\w\s]/g, '')
        .replace(/\s+/g, ' ')
        .trim();

      return base
        .split(' ')
        .map((word) => this.singularize_(word))
        .join(' ');
    },

    singularize_(word) {
      if (word.length < 4) {
        return word;
      }

      if (word.slice(-3) === 'ies') {
        return word.slice(0, -3) + 'y';
      }

      if (word.slice(-2) === 'es' && word.length > 4) {
        return word.slice(0, -2);
      }

      if (word.slice(-1) === 's') {
        return word.slice(0, -1);
      }

      return word;
    },

    fuzzyRatio_(a, b) {
      if (!a || !b) {
        return 0;
      }

      if (a === b) {
        return 1;
      }

      const distance = this.levenshtein_(a, b);
      const maxLen = Math.max(a.length, b.length);

      return maxLen ? 1 - distance / maxLen : 0;
    },

    levenshtein_(a, b) {
      const rows = a.length + 1;
      const cols = b.length + 1;
      const matrix = [];

      for (let i = 0; i < rows; i++) {
        matrix[i] = [i];
      }

      for (let j = 0; j < cols; j++) {
        matrix[0][j] = j;
      }

      for (let i = 1; i < rows; i++) {
        for (let j = 1; j < cols; j++) {
          const cost = a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1;
          matrix[i][j] = Math.min(
            matrix[i - 1][j] + 1,
            matrix[i][j - 1] + 1,
            matrix[i - 1][j - 1] + cost
          );
        }
      }

      return matrix[a.length][b.length];
    },

    parseCsv_(text) {
      const cleaned = text.replace(/^\uFEFF/, '');
      const rows = [];
      let row = [];
      let field = '';
      let inQuotes = false;

      for (let i = 0; i < cleaned.length; i++) {
        const char = cleaned.charAt(i);
        const next = cleaned.charAt(i + 1);

        if (inQuotes) {
          if (char === '"' && next === '"') {
            field += '"';
            i++;
          } else if (char === '"') {
            inQuotes = false;
          } else {
            field += char;
          }
          continue;
        }

        if (char === '"') {
          inQuotes = true;
          continue;
        }

        if (char === ',') {
          row.push(field);
          field = '';
          continue;
        }

        if (char === '\n' || (char === '\r' && next === '\n')) {
          row.push(field);
          field = '';

          if (row.some((cell) => String(cell).trim())) {
            rows.push(row);
          }

          row = [];

          if (char === '\r') {
            i++;
          }

          continue;
        }

        if (char !== '\r') {
          field += char;
        }
      }

      row.push(field);

      if (row.some((cell) => String(cell).trim())) {
        rows.push(row);
      }

      if (!rows.length) {
        throw new Error('The CSV file is empty.');
      }

      const headers = rows[0].map((header) => String(header).trim());

      if (!headers.some((header) => header)) {
        throw new Error('The CSV file is missing a header row.');
      }

      const dataRows = rows.slice(1).map((cells) => {
        const record = {};

        headers.forEach((header, index) => {
          if (!header) {
            return;
          }

          record[header] = cells[index] === undefined ? '' : String(cells[index]).trim();
        });

        return record;
      });

      return { headers: headers, rows: dataRows };
    },

    escapeHtml_(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  };
</script>
