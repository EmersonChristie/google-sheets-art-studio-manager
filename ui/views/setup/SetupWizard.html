<div id="setup-view" hidden>
  <div class="card">
    <h2>Setup Wizard</h2>
    <p>Connect this sheet to your organization, website, image hosting, and publish workflow.</p>

    <div class="field">
      <label for="artistName">Organization / Studio Name</label>
      <input id="artistName" placeholder="Pfeiffer-Christie Contemporary">
    </div>

    <div class="field">
      <label for="websiteUrl">Website URL</label>
      <input id="websiteUrl" placeholder="https://example.com">
    </div>

    <div class="field">
      <label for="cloudinaryCloudName">Cloudinary Cloud Name</label>
      <input id="cloudinaryCloudName" placeholder="your-cloud-name">
    </div>

    <div class="field">
      <label for="cloudinaryUploadPreset">Cloudinary Upload Preset</label>
      <input id="cloudinaryUploadPreset" placeholder="artist_uploads">
    </div>

    <div class="field">
      <label for="deployHookUrl">Deploy Hook URL</label>
      <input id="deployHookUrl" placeholder="https://api.netlify.com/build_hooks/...">
    </div>

    <div class="field field--radios">
      <p class="section-label">Default Image Storage</p>
      <label class="radio-option">
        <input type="radio" name="setupImageStorageMode" value="default-folder" checked>
        Artwork folder
      </label>
      <label class="radio-option">
        <input type="radio" name="setupImageStorageMode" value="artwork-subfolder">
        Individual artwork subfolder
      </label>
      <p class="field-hint">Used as the default when adding new artworks.</p>
    </div>

    <button class="button-primary" type="button" onclick="saveSetup()">Save Setup</button>
    <div id="setupStatus" class="status"></div>
  </div>
</div>
