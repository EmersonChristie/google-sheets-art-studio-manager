<script>
  const SETUP_FIELDS = [
    'artistName',
    'websiteUrl',
    'cloudinaryCloudName',
    'cloudinaryUploadPreset',
    'deployHookUrl'
  ];

  const ARTWORK_FIELDS = [
    'title',
    'medium',
    'dimensions',
    'price',
    'status',
    'description',
    'imageUrl'
  ];

  document.addEventListener('DOMContentLoaded', () => {
    setupTabs();
    showScreen(window.APP_INITIAL_SCREEN || 'setup');
    loadSetup();
  });

  function setupTabs() {
    document.querySelectorAll('.tab-button').forEach((button) => {
      button.addEventListener('click', () => {
        showScreen(button.dataset.screen);
      });
    });
  }

  function showScreen(screenName) {
    document.querySelectorAll('.screen').forEach((screen) => {
      screen.classList.toggle('is-active', screen.id === `screen-${screenName}`);
    });

    document.querySelectorAll('.tab-button').forEach((button) => {
      button.classList.toggle('is-active', button.dataset.screen === screenName);
    });
  }

  function loadSetup() {
    google.script.run
      .withSuccessHandler((settings) => {
        SETUP_FIELDS.forEach((field) => setValue(field, settings[field]));
      })
      .withFailureHandler((err) => setStatus('setupStatus', err.message))
      .getSetup();
  }

  function saveSetup() {
    setStatus('setupStatus', 'Saving...');

    const settings = SETUP_FIELDS.reduce((acc, field) => {
      acc[field] = getValue(field);
      return acc;
    }, {});

    google.script.run
      .withSuccessHandler((res) => setStatus('setupStatus', res.message))
      .withFailureHandler((err) => setStatus('setupStatus', err.message))
      .saveSetup(settings);
  }

  function saveArtwork() {
    setStatus('artworkStatus', 'Saving...');

    const artwork = ARTWORK_FIELDS.reduce((acc, field) => {
      acc[field] = getValue(field);
      return acc;
    }, {});

    google.script.run
      .withSuccessHandler((res) => {
        ARTWORK_FIELDS.forEach((field) => setValue(field, field === 'status' ? 'Available' : ''));
        setStatus('artworkStatus', res.message);
      })
      .withFailureHandler((err) => setStatus('artworkStatus', err.message))
      .saveArtwork(artwork);
  }

  function getValue(id) {
    return document.getElementById(id)?.value.trim() || '';
  }

  function setValue(id, value) {
    const el = document.getElementById(id);
    if (el) el.value = value || '';
  }

  function setStatus(id, message) {
    const el = document.getElementById(id);
    if (el) el.textContent = message || '';
  }
</script>
