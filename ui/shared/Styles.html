<style>
  :root {
    --color-bg: #f7f5f0;
    --color-surface: #ffffff;
    --color-text: #171717;
    --color-muted: #737373;
    --color-border: #e5e1d8;
    --color-accent: #2f4f3e;
    --color-accent-soft: #e8eee9;

    /* --radius-sm: 10px;
    --radius-md: 16px;
    --radius-lg: 24px; */

    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;

    --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.05);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--color-bg);
    color: var(--color-text);
    font-family:
      Inter,
      ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
  }

  .app-shell {
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    padding: var(--space-4);
  }

  .app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: var(--space-4);
  }

  .eyebrow {
    margin: 0 0 var(--space-1);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--color-muted);
  }

  h1 {
    margin: 0;
    font-size: 22px;
    line-height: 1.1;
    letter-spacing: -0.03em;
  }

  h2 {
    margin: 0 0 var(--space-2);
    font-size: 18px;
    letter-spacing: -0.02em;
  }

  p {
    color: var(--color-muted);
    line-height: 1.45;
  }

  .tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-2);
    margin-bottom: var(--space-4);
  }

  .tab-button {
    border: 1px solid var(--color-border);
    /* border-radius: 999px; */
    background: var(--color-surface);
    color: var(--color-text);
    padding: 10px 12px;
    font-size: 13px;
    cursor: pointer;
  }

  .tab-button.is-active {
    background: var(--color-accent);
    border-color: var(--color-accent);
    color: #fff;
  }

  .screen {
    display: none;
  }

  .screen.is-active {
    display: block;
  }

  .card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    /* border-radius: var(--radius-lg); */
    box-shadow: var(--shadow-soft);
    padding: var(--space-4);
  }

  .field {
    margin-top: var(--space-4);
  }

  label {
    display: block;
    margin-bottom: var(--space-2);
    font-size: 12px;
    font-weight: 700;
  }

  input,
  textarea,
  select {
    width: 100%;
    border: 1px solid var(--color-border);
    /* border-radius: var(--radius-sm); */
    background: #fff;
    padding: 12px;
    font-size: 15px;
  }

  textarea {
    min-height: 96px;
    resize: vertical;
  }

  .button-primary {
    width: 100%;
    margin-top: var(--space-5);
    border: 0;
    /* border-radius: 999px; */
    background: var(--color-accent);
    color: #fff;
    padding: 13px 16px;
    font-weight: 700;
    cursor: pointer;
  }

  .status {
    margin-top: var(--space-3);
    font-size: 13px;
    color: var(--color-muted);
  }

  @media (max-width: 420px) {
    .app-shell {
      padding: var(--space-3);
    }

    input,
    textarea,
    select {
      font-size: 16px;
    }
  }
</style>
